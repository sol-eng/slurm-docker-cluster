[server]
address=0.0.0.0
port=5559
server-user=rstudio-server
admin-group=rstudio-server
authorization-enabled=1
thread-pool-size=4
enable-debug-logging=1

[cluster]
name=local
type=Local

[cluster]
name=cluster1
type=Slurm
config-file=/etc/rstudio/launcher.cluster1.conf 

[cluster]
name=cluster2
type=Slurm
config-file=/etc/rstudio/launcher.cluster2.conf 


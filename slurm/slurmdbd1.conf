#
# Example slurmdbd.conf file.
#
# See the slurmdbd.conf man page for more information.
#
# Archive info
#ArchiveJobs=yes
#ArchiveDir="/tmp"
#ArchiveSteps=yes
#ArchiveScript=
#JobPurge=12
#StepPurge=1
#
# Authentication info
AuthType=auth/munge
AuthInfo=socket=/run/munge/munge.socket.1
#AuthInfo=/var/run/munge/munge.socket.2
#
# slurmDBD info
DbdAddr=slurmdbd1
DbdHost=slurmdbd1
#DbdPort=6819
SlurmUser=slurm
#MessageTimeout=300
DebugLevel=9
#DefaultQOS=normal,standby
LogFile=/var/log/slurm/1/slurmdbd.log
PidFile=/var/run/slurmdbd/1/slurmdbd.pid
#PluginDir=/usr/lib/slurm
#PrivateData=accounts,users,usage,jobs
#TrackWCKey=yes
#
# Database info
StorageType=accounting_storage/mysql
StorageHost=mysql1
StorageUser=slurm
StoragePass=password
StorageLoc=slurm_acct_db
